<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>NexAI | Security Portal</title>

    <!-- FACE AI -->
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#050505;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
            font-family:Arial, sans-serif;
            color:white;
            position:relative;
        }

        .glow-bg{
            position:absolute;
            width:700px;
            height:700px;

            background:
            radial-gradient(
                circle,
                rgba(0,212,255,0.18) 0%,
                rgba(0,85,255,0) 70%
            );

            border-radius:50%;

            filter:blur(80px);

            animation:
            moveGlow 10s infinite alternate;

            z-index:-1;
        }

        @keyframes moveGlow{

            from{
                transform:
                translate(-20%, -20%);
            }

            to{
                transform:
                translate(20%, 20%);
            }
        }

        .auth-container{

            width:380px;

            padding:50px;

            border-radius:35px;

            background:
            rgba(255,255,255,0.04);

            border:
            1px solid rgba(255,255,255,0.08);

            backdrop-filter:blur(20px);

            text-align:center;

            box-shadow:
            0 20px 60px rgba(0,0,0,0.5);
        }

        .logo-text{

            font-size:3.5rem;

            font-weight:900;

            background:
            linear-gradient(
                to right,
                #00d4ff,
                #0055ff
            );

            -webkit-background-clip:text;

            -webkit-text-fill-color:transparent;

            margin-bottom:10px;
        }

        .sub-text{

            color:#777;

            font-size:0.95rem;

            margin-bottom:30px;
        }

        input{

            width:100%;

            padding:16px;

            border:none;

            outline:none;

            border-radius:14px;

            background:
            rgba(255,255,255,0.06);

            border:
            1px solid rgba(255,255,255,0.08);

            color:white;

            font-size:1rem;
        }

        input::placeholder{
            color:#666;
        }

        .btn-main{

            width:100%;

            padding:15px;

            margin-top:20px;

            border:none;

            border-radius:14px;

            background:#00d4ff;

            color:black;

            font-weight:bold;

            font-size:1rem;

            cursor:pointer;

            transition:0.4s;
        }

        .btn-main:hover{

            transform:translateY(-2px);

            box-shadow:
            0 0 25px rgba(0,212,255,0.5);
        }

        #bioArea{

            margin-top:30px;

            display:none;
        }

        #bioArea p{

            color:#00d4ff;

            font-size:0.85rem;

            letter-spacing:1px;

            margin-bottom:15px;
        }

        .scan-icon{

            font-size:4rem;

            cursor:pointer;

            transition:0.3s;
        }

        .scan-icon:hover{

            filter:
            drop-shadow(0 0 15px #00d4ff);

            transform:scale(1.05);
        }

        .biometric-link{

            display:block;

            margin-top:22px;

            color:#00d4ff;

            text-decoration:none;

            font-size:0.85rem;

            opacity:0.7;

            cursor:pointer;
        }

        .status-text{

            margin-top:15px;

            font-size:0.8rem;

            color:#00d4ff;

            opacity:0.8;
        }

        video{

            width:100%;

            margin-top:20px;

            border-radius:20px;

            display:none;

            border:
            1px solid rgba(255,255,255,0.1);
        }

    </style>

</head>

<body>

    <div class="glow-bg"></div>

    <div class="auth-container">

        <div class="logo-text">
            NexAI
        </div>

        <p class="sub-text">
            No Passwords. Just Intelligence.
        </p>

        <input
            type="email"
            id="userEmail"
            placeholder="Enter your Gmail ID..."
        >

        <button
            class="btn-main"
            onclick="handleAuth()">

            Continue with Identity

        </button>

        <div id="bioArea">

            <p>
                Scan Face / Fingerprint to Continue
            </p>

            <div
                class="scan-icon"
                onclick="startScan()">

                👤

            </div>

            <video
                id="camera"
                autoplay
                playsinline>
            </video>

            <div
                class="status-text"
                id="statusText">

                NexAI biometric ready

            </div>

        </div>

        <span
            class="biometric-link"
            id="setupLink"
            onclick="toggleBio()">

            Setup Biometric Lock

        </span>

    </div>

    <script>

        // =====================================
        // BACKEND URL
        // =====================================

        const BACKEND_URL =
        "https://nexai-voice-backend.onrender.com";

        // =====================================
        // LOAD FACE AI
        // =====================================

        async function loadFaceAI(){

            try{

                document.getElementById(
                    'statusText'
                ).innerText =

                "Loading AI face engine...";

                await faceapi.nets.tinyFaceDetector.loadFromUri(
                    'https://cdn.jsdelivr.net/npm/face-api.js/weights'
                );

                console.log(
                    "Face AI Loaded"
                );

            }

            catch(error){

                console.error(
                    "Face AI Error:",
                    error
                );

                document.getElementById(
                    'statusText'
                ).innerText =

                "AI face engine failed.";
            }
        }

        loadFaceAI();

        // =====================================
        // AUTH
        // =====================================

        async function handleAuth(){

            const emailInput =
            document.getElementById(
                'userEmail'
            );

            const email =
            emailInput.value
            .trim()
            .toLowerCase();

            if(!email){

                alert(
                    "Please enter your Gmail ID"
                );

                return;
            }

            if(!email.includes("@gmail.com")){

                alert(
                    "Please enter a valid Gmail address"
                );

                return;
            }

            try{

                document.getElementById(
                    'statusText'
                ).innerText =

                "Connecting to NexAI server...";

                const response =
                await fetch(

                    `${BACKEND_URL}/register`,

                    {
                        method:'POST',

                        headers:{
                            'Content-Type':'application/json'
                        },

                        body: JSON.stringify({

                            email: email,

                            biometric_key:
                            "browser_face_pending"
                        })
                    }
                );

                if(!response.ok){

                    throw new Error(
                        "Backend response failed"
                    );
                }

                const data =
                await response.json();

                console.log(
                    "NexAI Server:",
                    data
                );

                localStorage.setItem(
                    "userEmail",
                    email
                );

                document.getElementById(
                    'bioArea'
                ).style.display =
                'block';

                document.getElementById(
                    'setupLink'
                ).style.display =
                'none';

                document.getElementById(
                    'statusText'
                ).innerText =

                data.message ||
                "Identity verified successfully";

            }

            catch(error){

                console.error(
                    "Backend Error:",
                    error
                );

                document.getElementById(
                    'statusText'
                ).innerText =

                "Neural connection failed.";

                alert(
                    "Backend connection failed"
                );
            }
        }

        // =====================================
        // AI FACE SCAN
        // =====================================

        async function startScan(){

    const email =
    document.getElementById(
        'userEmail'
    ).value
    .trim()
    .toLowerCase();

    if(!email){

        alert(
            "Email missing"
        );

        return;
    }

    const video =
    document.getElementById(
        'camera'
    );

    try{

        // CAMERA ACCESS

        const stream =
        await navigator
        .mediaDevices
        .getUserMedia({

            video:true,
            audio:false
        });

        video.srcObject =
        stream;

        video.style.display =
        "block";

        document.getElementById(
            'statusText'
        ).innerText =

        "Scanning Face...";

        // WAIT CAMERA

        setTimeout(async ()=>{

            // CAPTURE IMAGE

            const canvas =
            document.createElement(
                "canvas"
            );

            canvas.width =
            video.videoWidth;

            canvas.height =
            video.videoHeight;

            const ctx =
            canvas.getContext("2d");

            ctx.drawImage(
                video,
                0,
                0
            );

            // FACE DATA

            const faceData =
            canvas.toDataURL(
                "image/png"
            );

            // CHECK EXISTING FACE

            const savedFace =
            localStorage.getItem(
                "face_" + email
            );

            // NEW USER

            if(!savedFace){

                localStorage.setItem(
                    "face_" + email,
                    faceData
                );

                document.getElementById(
                    'statusText'
                ).innerText =

                "New identity secured";

                alert(
                    "Signup Successful"
                );
            }

            // OLD USER

            else{

                if(savedFace === faceData){

                    document.getElementById(
                        'statusText'
                    ).innerText =

                    "Face verified successfully";

                    alert(
                        "Login Successful"
                    );
                }

                else{

                    document.getElementById(
                        'statusText'
                    ).innerText =

                    "Face mismatch detected";

                    alert(
                        "Access Denied"
                    );
                }
            }

            // STOP CAMERA

            stream.getTracks().forEach(
                track => track.stop()
            );

        }, 3000);

    }

    catch(error){

        console.error(
            "Camera Error:",
            error
        );

        document.getElementById(
            'statusText'
        ).innerText =

        "Camera permission denied";

        alert(
            "Please allow camera access"
        );
    }
}

        // =====================================
        // MANUAL TOGGLE
        // =====================================

        function toggleBio(){

            const email =
            document.getElementById(
                'userEmail'
            ).value;

            if(!email){

                alert(
                    "Enter your email first"
                );
            }

            else{

                document.getElementById(
                    'bioArea'
                ).style.display =
                'block';

                document.getElementById(
                    'statusText'
                ).innerText =

                "Biometric setup enabled";
            }
        }

    </script>

</body>
</html>
