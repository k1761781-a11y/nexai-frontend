<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>NexAI | The Living Cortex</title>

    <style>
        body {
            margin: 0;
            background: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            color: #fff;
        }

        /* TRANSITION OVERLAY - Clicking Effect */
        #transition-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 212, 255, 0);
            z-index: 9999;
            pointer-events: none;
            transition: all 0.8s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ai-core-container {
            position: relative;
            z-index: 10;
            text-align: center;
            transition: all 1s ease;
        }

        .ai-core {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #00d4ff 0%, #0055ff 50%, transparent 70%);
            border-radius: 50%;
            filter: blur(25px);
            animation: breathe 4s infinite ease-in-out;
            transition: all 0.5s ease;
        }

        /* Animation for Core Power-up */
        .core-burst {
            transform: scale(5) !important;
            filter: blur(10px) brightness(2);
            opacity: 1 !important;
        }

        .node {
            position: absolute;
            width: 100px;
            height: 100px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,212,255,0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            transition: 0.4s;
            cursor: pointer;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00d4ff;
        }

        .node:hover {
            transform: scale(1.15);
            background: rgba(0,212,255,0.2);
            box-shadow: 0 0 30px #00d4ff;
            border: 1px solid #00d4ff;
            color: #fff;
        }

        .left-1 { left: -350px; top: -50px; }
        .left-2 { left: -300px; top: 150px; }
        .right-1 { right: -350px; top: -50px; }
        .right-2 { right: -300px; top: 150px; }

        .node-icon { font-size: 1.5rem; margin-bottom: 8px; }

        @keyframes breathe {
            0%,100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.12); opacity: 1; }
        }

        .status-bar {
            position: absolute;
            bottom: 40px;
            width: 80%;
            text-align: center;
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: #d1d5db;
            text-transform: uppercase;
            line-height: 1.6;
            z-index: 20;
        }

        #welcome-box {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
        }
    </style>
</head>

<body>

    <div id="transition-overlay"></div>

    <div id="welcome-box">
        <p style="margin:0; color:#38bdf8; font-size:0.8rem; letter-spacing:2px; text-transform:uppercase;">Authorized Access</p>
        <h2 id="userName" style="margin:0; color:white; font-size:1.5rem; font-weight:300;">
            Welcome, <span style="color:#fbbf24; font-weight:bold;">Agent</span>
        </h2>
    </div>

    <div class="ai-core-container" id="main-hub">
        <div class="ai-core" id="central-core"></div>
        <p id="core-label" style="margin-top:20px; letter-spacing:5px; color:#00d4ff;">CORE ACTIVE</p>

        <div id="node-cortex" class="node left-1" onclick="triggerTransition('Neural Cortex', 'ai_command.html')">
            <span class="node-icon">🧠</span>
            <span>Neural Cortex</span>
        </div>

        <div id="node-legion" class="node left-2" onclick="openPage('Legion')">
            <span class="node-icon">👥</span>
            <span>Elite Legion</span>
        </div>

        <div id="node-genesis" class="node right-1" onclick="openPage('Genesis')">
            <span class="node-icon">⚡</span>
            <span>Project Genesis</span>
        </div>

        <div id="node-protocol" class="node right-2" onclick="openPage('Protocol')">
            <span class="node-icon">💎</span>
            <span>Protocol</span>
        </div>
    </div>

    <div class="status-bar" id="status-text">Neural Cortex Booting...</div>

    <script>
        // =====================================
        // FIXED LIVE BACKEND URL
        // =====================================
        const BACKEND_URL = "https://nexai-voice-backend.onrender.com";

        function triggerTransition(nodeName, targetUrl) {
            const core = document.getElementById('central-core');
            const status = document.getElementById('status-text');
            const overlay = document.getElementById('transition-overlay');
            const hub = document.getElementById('main-hub');

            status.style.color = "#00d4ff";
            status.innerText = `AUTHORIZING ${nodeName.toUpperCase()} LINK...`;

            core.classList.add('core-burst');
            hub.style.opacity = "0.3";
            hub.style.transform = "scale(0.8)";

            overlay.style.background = "rgba(0, 212, 255, 0.2)";
            overlay.style.backdropFilter = "blur(20px)";

            setTimeout(() => {
                window.location.href = targetUrl;
            }, 2000);
        }

        const userEmail = localStorage.getItem('userEmail');
        let name = "Agent";
        if (userEmail) {
            name = userEmail.split('@')[0];
            document.getElementById('userName').innerHTML = `Welcome, <span style="color:#fbbf24; font-weight:bold;">${name}</span>`;
        }

        function openPage(nodeName) {
            document.getElementById('status-text').innerText = `Accessing ${nodeName} Protocol...`;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US'; // English commands ke liye best hai, Hindi-IN mixed bhi samjhega
        recognition.continuous = false;
        recognition.interimResults = false;

        function startListening() {
            try { recognition.start(); } catch(e) {}
            document.getElementById('status-text').innerText = "SITARA IS LISTENING...";
        }

        recognition.onresult = async (event) => {
            const transcript = event.results[0][0].transcript.toLowerCase().trim();
            document.getElementById('status-text').innerText = "PROCESSING...";
            console.log("User Said:", transcript);

            // =====================================
            // NEW FEATURE: VOICE TO CLICK COMMANDS
            // =====================================
            if (transcript.includes("cortex") || transcript.includes("neural cortex")) {
                document.getElementById('node-cortex').click();
                return;
            }
            if (transcript.includes("legion") || transcript.includes("elite legion")) {
                document.getElementById('node-legion').click();
                setTimeout(() => { startListening(); }, 2000);
                return;
            }
            if (transcript.includes("genesis") || transcript.includes("project genesis")) {
                document.getElementById('node-genesis').click();
                setTimeout(() => { startListening(); }, 2000);
                return;
            }
            if (transcript.includes("protocol")) {
                document.getElementById('node-protocol').click();
                setTimeout(() => { startListening(); }, 2000);
                return;
            }

            // Normal chatbot query agar koi button command nahi hai
            try {
                const response = await fetch(`${BACKEND_URL}/chat?prompt=${encodeURIComponent(transcript)}`);
                const data = await response.json();
                document.getElementById('status-text').innerText = data.reply;

                if (data.audio_url) {
                    const oldAudio = document.getElementById("sitara-audio");
                    if (oldAudio) oldAudio.remove();
                    const audio = document.createElement("audio");
                    audio.id = "sitara-audio";
                    audio.src = data.audio_url;
                    audio.autoplay = true;
                    document.body.appendChild(audio);
                    
                    audio.onended = () => { startListening(); };
                } else {
                    setTimeout(() => { startListening(); }, 2000);
                }
            } catch(err) {
                console.error("Error:", err);
                document.getElementById('status-text').innerText = "Neural Link Failed.";
                setTimeout(() => { startListening(); }, 3000);
            }
        };

        recognition.onerror = (event) => { setTimeout(() => { startListening(); }, 2000); };

        window.onload = () => {
            setTimeout(() => { startListening(); }, 1500);
        };

        // Mouse Effect
        document.addEventListener('mousemove', (e) => {
            const nodes = document.querySelectorAll('.node');
            nodes.forEach(node => {
                const rect = node.getBoundingClientRect();
                const x = e.clientX - (rect.left + rect.width / 2);
                const y = e.clientY - (rect.top + rect.height / 2);
                const distance = Math.sqrt(x*x + y*y);
                if (distance < 200) {
                    node.style.transform = `scale(${1.2 - distance/1000}) translate(${x/10}px, ${y/10}px)`;
                }
            });
        });
    </script>
</body>
</html>
